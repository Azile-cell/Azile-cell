<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 112" width="760" height="112" role="img" aria-label="Skills and tools. What I work with, and what I&#x27;m learning next." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Skills and tools. What I work with, and what I&#x27;m learning next.</title>
  <defs>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#8A0012"/>
      <stop offset="0.35" stop-color="#FF1F2D"/>
      <stop offset="0.5" stop-color="#FFD9D9"/>
      <stop offset="0.65" stop-color="#FF1F2D"/>
      <stop offset="1" stop-color="#8A0012"/>
    </linearGradient>
    <mask id="tm" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="112">
      <text class="f" x="48" y="56" font-size="32" font-weight="700" fill="#fff">Skills and tools</text>
    </mask>
  </defs>
  <style>
    .f { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, "Courier New", monospace; }
    .flow { animation: flow 6s linear infinite; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(var(--p)); } }
    .breathe { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .22; } 50% { opacity: .85; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .dot { animation: travel 5.0s ease-in-out infinite alternate; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(300px); } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .dot { animation: none; }
      .dot { transform: translateX(150px); }
    }
  </style>
  <rect x="1" y="1" width="758" height="110" rx="20" fill="#070707"/>
  <rect x="1" y="1" width="758" height="110" rx="20" fill="none" stroke="#7A0010" stroke-width="1.5"/>
  <g mask="url(#tm)" filter="url(#soft)" class="">
    <rect class="flow" style="animation-duration:6s;--p:360px" x="-360" y="0" width="1480" height="112" fill="url(#tg)"/>
  </g>
  <text class="f" x="48" y="88" font-size="15" fill="#FFD9D9" fill-opacity="0.85">What I work with, and what I&#x27;m learning next.</text>
  <line x1="412" y1="46" x2="712" y2="46" stroke="#7A0010" stroke-width="2" stroke-linecap="round"/>
  <circle class="dot" cx="412" cy="46" r="5" fill="#FFD9D9" filter="url(#soft)"/>
</svg>
