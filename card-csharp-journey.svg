<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 198" width="760" height="198" role="img" aria-label="C# Learning Journey, Learning Project. Exercises and small applications from my C# learning. Covers OOP, arrays, files, exceptions and Windows Forms. Opens the repository on GitHub." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>C# Learning Journey</title>
  <defs>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1F2D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF1F2D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF1F2D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="758" height="196" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, "Courier New", monospace; }
    .flow { animation: flow 6s linear infinite; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(var(--p)); } }
    .breathe { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .22; } 50% { opacity: .85; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .strip { animation: strip 3.2s ease-in-out infinite; }
    .nudge { animation: nudge 1.8s ease-in-out infinite; }
    .sweep { animation: sweep 6.8s ease-in-out 3.0s infinite; transform: translateX(-300px) skewX(-20deg); }
    @keyframes strip { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes sweep { 0% { transform: translateX(-300px) skewX(-20deg); } 55%,100% { transform: translateX(1060px) skewX(-20deg); } }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .strip, .pulse, .nudge, .sweep { animation: none; }
      .breathe { opacity: .5; } .sweep { opacity: 0; }
    }
  </style>
  <rect x="1" y="1" width="758" height="196" rx="20" fill="#070707"/>
  <rect class="breathe" x="1.5" y="1.5" width="757" height="195" rx="20" fill="none" stroke="#FF1F2D" stroke-width="2.5" filter="url(#glow)" opacity=".5"/>
  <rect x="1" y="1" width="758" height="196" rx="20" fill="none" stroke="#7A0010" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect class="sweep" x="0" y="-20" width="150" height="238" fill="url(#sweepG)"/></g>
  <rect class="strip" x="20" y="30" width="4" height="138" rx="2" fill="#FF1F2D" filter="url(#soft)"/>
  <text class="f" x="48" y="66" font-size="30" font-weight="700" fill="#FFE9E9" filter="url(#soft)">C# Learning Journey</text>
  <text class="f" x="48" y="106" font-size="17" fill="#FFD9D9" fill-opacity="0.92">Exercises and small applications from my C# learning.</text>
  <text class="f" x="48" y="132" font-size="17" fill="#FFD9D9" fill-opacity="0.92">Covers OOP, arrays, files, exceptions and Windows Forms.</text>
  <text class="f" x="48" y="168" font-size="13" font-weight="700" letter-spacing="1.5" fill="#E10600" xml:space="preserve">C#  •  OOP  •  WINDOWS FORMS</text>
  <rect x="511" y="32" width="209" height="32" rx="16" fill="none" stroke="#FF1F2D" stroke-width="1.5"/>
  <circle class="pulse" cx="531" cy="48" r="4" fill="#FF1F2D" filter="url(#soft)"/>
  <text class="f" x="543" y="53" font-size="12" font-weight="700" letter-spacing="2" fill="#FF5A5F">LEARNING PROJECT</text>
  <text class="f" x="690" y="168" font-size="13" font-weight="700" letter-spacing="2" fill="#FF5A5F" text-anchor="end">VIEW ON GITHUB</text>
  <g class="nudge"><path d="M700 163 h18 m-6 -6 l6 6 l-6 6" fill="none" stroke="#FF1F2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
