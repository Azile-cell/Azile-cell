<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" role="img" aria-label="About Azile Gomomo. I study BCom Information Systems at the University of Johannesburg (UJ). I learn through coursework, hackathons and hands-on projects that solve real problems. My goal is to become a capable software developer with strong full-stack and database skills." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>About Azile Gomomo. I study BCom Information Systems at the University of Johannesburg (UJ). I learn through coursework, hackathons and hands-on projects that solve real problems. My goal is to become a capable software developer with strong full-stack and database skills.</title>
  <defs>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .f { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, "Courier New", monospace; }
    .flow { animation: flow 6s linear infinite; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(var(--p)); } }
    .breathe { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .22; } 50% { opacity: .85; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .breathe, .pulse { animation: none; } .breathe { opacity: .5; } }
  </style>
  <rect x="1" y="1" width="758" height="304" rx="20" fill="#070707"/>
  <rect class="breathe" x="1.5" y="1.5" width="757" height="303" rx="20" fill="none" stroke="#FF1F2D" stroke-width="2.5" filter="url(#glow)" opacity=".5"/>
  <rect x="1" y="1" width="758" height="304" rx="20" fill="none" stroke="#7A0010" stroke-width="1.5"/>
  <circle class="breathe" cx="654" cy="100" r="58" fill="none" stroke="#FF1F2D" stroke-width="4" filter="url(#glow)" opacity=".5"/>
  <circle cx="654" cy="100" r="58" fill="#000" stroke="#C4001A" stroke-width="3"/>
  <circle cx="654" cy="100" r="47" fill="none" stroke="#5A000C" stroke-width="1.5"/>
  <text class="f" x="654" y="116" font-size="44" font-weight="700" text-anchor="middle" fill="#E8A857" filter="url(#soft)">AG</text>
  <text class="f" x="48" y="70" font-size="26" font-weight="700" fill="#E8A857" filter="url(#soft)">Hi, I&#x27;m Azile Gomomo.</text>
  <text class="f" x="48" y="116" font-size="17" font-weight="400" fill="#FFD9D9" fill-opacity="0.92">I study BCom Information Systems at the</text>
  <text class="f" x="48" y="142" font-size="17" font-weight="400" fill="#FFD9D9" fill-opacity="0.92">University of Johannesburg (UJ).</text>
  <text class="f" x="48" y="184" font-size="17" font-weight="400" fill="#FFD9D9" fill-opacity="0.92">I learn through coursework, hackathons and</text>
  <text class="f" x="48" y="210" font-size="17" font-weight="400" fill="#FFD9D9" fill-opacity="0.92">hands-on projects that solve real problems.</text>
  <text class="f" x="48" y="252" font-size="17" font-weight="400" fill="#FFD9D9" fill-opacity="0.92">My goal is to become a capable software developer</text>
  <text class="f" x="48" y="278" font-size="17" font-weight="400" fill="#FFD9D9" fill-opacity="0.92">with strong full-stack and database skills.</text>
</svg>
