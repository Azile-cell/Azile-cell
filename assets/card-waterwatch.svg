<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">Waterwatch AI project card</title><desc id="desc">Teal project card for Waterwatch AI.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050B12"/><stop offset="100%" stop-color="#08141A"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#20D7C7"/><stop offset="100%" stop-color="#39E4D1"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.title{font-family:Arial,Helvetica,sans-serif;font-size:60px;font-weight:700;fill:#A8FFF7}.body{font-family:"Courier New",monospace;font-size:30px;font-weight:700;fill:#F2FFFD}.small{font-family:"Courier New",monospace;font-size:24px;font-weight:700;fill:#20D7C7;letter-spacing:2px}.cta{font-family:"Courier New",monospace;font-size:27px;font-weight:700;fill:#A8FFF7;letter-spacing:2px}.badge{font-family:"Courier New",monospace;font-size:23px;font-weight:700;fill:#77F3E7;letter-spacing:3px}</style>
</defs>
<rect x="18" y="18" width="1564" height="384" rx="34" fill="url(#bg)" stroke="url(#accent)" stroke-width="4"/>
<rect x="18" y="18" width="1564" height="384" rx="34" fill="none" stroke="#20D7C7" stroke-opacity=".28" stroke-width="2" filter="url(#glow)"/>
<rect x="46" y="74" width="10" height="250" rx="5" fill="#20D7C7" filter="url(#glow)"/>
<text x="95" y="125" class="title" filter="url(#glow)">Waterwatch AI</text>
<rect x="1080" y="72" width="410" height="62" rx="31" fill="none" stroke="#20D7C7" stroke-width="3"/>
<circle cx="1120" cy="103" r="8" fill="#20D7C7"/><text x="1142" y="112" class="badge">AI HACKATHON PROTOTYPE</text>
<text x="95" y="198" class="body"><tspan x="95" dy="0">Municipal water-network prototype focused on reporting,</tspan><tspan x="95" dy="45">investigation and response workflows for water issues.</tspan></text>
<text x="95" y="338" class="small">UI/UX</text><text x="210" y="338" class="small">•</text><text x="255" y="338" class="small">FRONTEND</text><text x="465" y="338" class="small">•</text><text x="510" y="338" class="small">AWS</text><text x="610" y="338" class="small">•</text><text x="655" y="338" class="small">GIT/GITHUB</text>
<text x="1225" y="338" class="cta">VIEW ON GITHUB →</text>
</svg>