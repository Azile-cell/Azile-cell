.flow{animation:flow 7s linear infinite}@keyframes flow{from{transform:translateX(0)}to{transform:translateX(520px)}}
.breathe{animation:breathe 4.5s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.22}50%{opacity:.85}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.led{opacity:.08;animation:ledOn .5s ease-out both,ledWave 4.5s ease-in-out infinite}@keyframes ledOn{from{opacity:.08}to{opacity:.5}}@keyframes ledWave{0%,100%{opacity:.5}12%{opacity:1}28%{opacity:.5}}
