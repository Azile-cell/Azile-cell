  <style>
    .f { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, "Courier New", monospace; }
    .flow { animation: flow 6s linear infinite; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(var(--p)); } }
    .breathe { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .22; } 50% { opacity: .85; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .led { opacity: .08; animation: ledOn .5s ease-out both, ledWave 4.5s ease-in-out infinite; }
    @keyframes ledOn { from { opacity: .08; } to { opacity: .5; } }
    @keyframes ledWave { 0%,100% { opacity: .5; } 12% { opacity: 1; } 28% { opacity: .5; } }
    .neon { animation: neon 1.5s linear 1.3s both; }
    @keyframes neon { 0% { opacity: 0; } 10% { opacity: 1; } 14% { opacity: .25; } 18% { opacity: 1; } 24% { opacity: .5; } 30%,100% { opacity: 1; } }
    .rise { animation: rise 1s ease-out 2.4s both; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .led { animation: none; opacity: .85; }
      .neon, .rise, .flow, .breathe, .pulse { animation: none; }
      .breathe { opacity: .5; }
    }
  </style>
