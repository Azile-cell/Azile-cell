.rise{animation:rise 1s ease-out 2.4s both}@keyframes rise{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.led{animation:none;opacity:.85}.neon,.rise,.flow,.breathe,.pulse{animation:none}.breathe{opacity:.5}}
</style>
