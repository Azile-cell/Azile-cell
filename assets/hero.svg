  <title>Azile Gomomo. Aspiring full-stack and database developer. BCom Information Systems student at the University of Johannesburg. Open to internships, bursaries and hackathons.</title>
  <defs>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#8A0012"/>
      <stop offset="0.35" stop-color="#FF1F2D"/>
      <stop offset="0.5" stop-color="#FFD9D9"/>
      <stop offset="0.65" stop-color="#FF1F2D"/>
