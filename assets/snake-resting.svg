<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Contribution snake resting</title>
  <desc id="desc">A static red contribution grid shown when reduced motion is preferred.</desc>

  <style>
    .label { fill: #FF5A5F; font: 600 14px ui-monospace, Consolas, "Courier New", monospace; letter-spacing: 2px; }
    .rest { fill: #FFD9D9; font: 500 12px ui-monospace, Consolas, "Courier New", monospace; }
  </style>

  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="24" height="24" rx="5" fill="#0A0A0A" stroke="#7A0010" stroke-opacity=".5"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="24" fill="#000000"/>
  <text class="label" x="38" y="38">THE CONTRIBUTION PATH</text>
  <text class="rest" x="670" y="38">RESTING MODE</text>

  <rect x="35" y="55" width="830" height="118" rx="14" fill="url(#grid)"/>

  <rect x="74" y="94" width="24" height="24" rx="5" fill="#7A0010"/>
  <rect x="108" y="128" width="24" height="24" rx="5" fill="#E10600"/>
  <rect x="176" y="60" width="24" height="24" rx="5" fill="#7A0010"/>
  <rect x="244" y="94" width="24" height="24" rx="5" fill="#FF1F2D"/>
  <rect x="346" y="128" width="24" height="24" rx="5" fill="#E10600"/>
  <rect x="448" y="60" width="24" height="24" rx="5" fill="#7A0010"/>
  <rect x="550" y="94" width="24" height="24" rx="5" fill="#FF5A5F"/>
  <rect x="686" y="128" width="24" height="24" rx="5" fill="#E10600"/>
  <rect x="788" y="60" width="24" height="24" rx="5" fill="#7A0010"/>

  <path d="M520 142C565 142 570 86 616 86H720" fill="none" stroke="#FF1F2D" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="726" cy="86" r="12" fill="#FF1F2D" filter="url(#glow)"/>
  <circle cx="730" cy="82" r="2.5" fill="#FFD9D9"/>
</svg>
