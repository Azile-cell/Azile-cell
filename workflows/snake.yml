name: Paint the red contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Generate the red contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#FF1F2D&color_dots=#0A0A0A,#7A0010,#A90018,#E10600,#FF5A5F

      - name: Add the black room and reduced-motion guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/github-snake.svg")
          svg = path.read_text(encoding="utf-8")
          start = svg.find("<svg")
          end = svg.find(">", start)

          additions = """
          <rect width="100%" height="100%" rx="18" fill="#000000"/>
          <style>
            @media (prefers-reduced-motion: reduce) {
              * {
                animation: none !important;
                transition: none !important;
              }
            }
          </style>
          """

          svg = svg[:end + 1] + additions + svg[end + 1:]
          path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit the refreshed snake
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg
          git diff --cached --quiet || git commit -m "Refresh red contribution snake"
          git push
