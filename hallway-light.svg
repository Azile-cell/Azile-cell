<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="Heartbeat line. Thanks for stopping by. I&#x27;m still learning and still building. Say hello any time." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Heartbeat line. Thanks for stopping by. I&#x27;m still learning and still building. Say hello any time.</title>
  <defs>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .f { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, "Courier New", monospace; }
    .flow { animation: flow 6s linear infinite; }
    @keyframes flow { from { transform: translateX(0); } to { transform: translateX(var(--p)); } }
    .breathe { animation: breathe 4.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .22; } 50% { opacity: .85; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .beat { stroke-dasharray: 170 1000; animation: beat 3.6s linear infinite; }
    @keyframes beat { from { stroke-dashoffset: 170; } to { stroke-dashoffset: -1000; } }
    @media (prefers-reduced-motion: reduce) { .beat { animation: none; stroke-dasharray: none; } .breathe { animation: none; opacity: .5; } }
  </style>
  <rect x="1" y="1" width="758" height="188" rx="20" fill="#070707"/>
  <rect class="breathe" x="1.5" y="1.5" width="757" height="187" rx="20" fill="none" stroke="#FF1F2D" stroke-width="2.5" filter="url(#glow)" opacity=".5"/>
  <rect x="1" y="1" width="758" height="188" rx="20" fill="none" stroke="#7A0010" stroke-width="1.5"/>
  <path d="M48 70 H250 L270 70 L286 30 L308 108 L326 54 L338 70 H712" pathLength="1000" fill="none" stroke="#5A000C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="beat" d="M48 70 H250 L270 70 L286 30 L308 108 L326 54 L338 70 H712" pathLength="1000" fill="none" stroke="#FF1F2D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text class="f" x="380" y="138" font-size="22" font-weight="700" text-anchor="middle" fill="#FFE9E9">Thanks for stopping by.</text>
  <text class="f" x="380" y="166" font-size="15" text-anchor="middle" fill="#FFD9D9" fill-opacity="0.85">I'm still learning and still building. Say hello any time.</text>
</svg>
